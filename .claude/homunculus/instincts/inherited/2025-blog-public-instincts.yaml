# 2025 Blog Public Workflow Add New Blog Post

## Action

Follow the add-new-blog-post workflow:
1. Add new entry to public/blogs/index.json
2. Create new folder under public/blogs/{slug}/
3. Add config.json for the new post
4. Add index.md with the post content
5. Add any image assets (e.g., .webp) to the post folder

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: public/blogs/index.json, public/blogs/{slug}/config.json, public/blogs/{slug}/index.md

